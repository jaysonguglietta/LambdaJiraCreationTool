name: Security automation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_repository.py --staged
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: ruff format --check .
      - run: cfn-lint template.yaml
      - run: |
          python -m pip install --only-binary=:all: -r src/requirements.txt --target build/package
      - run: pip-audit -r src/requirements.txt --no-deps --disable-pip
      - run: python scripts/build_release.py --package-dir build/package --output build/security-jira.zip
      - run: python scripts/security_operator.py preview --risk tests/fixtures/risk.csv --issues tests/fixtures/issues.csv
